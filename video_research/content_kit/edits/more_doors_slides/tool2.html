<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:TT;src:url(/root/.fonts/TikTokSans-800.ttf);font-weight:800}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#000}
img.bg{position:absolute;inset:0;width:1080px;height:1440px;object-fit:cover}
/* TikTok default "Classic" text: TikTok Sans, white fill, black outline, no background */
.tt{position:absolute;left:36px;right:36px;top:280px;text-align:center;color:#fff;font-family:TT;font-weight:800;paint-order:stroke fill}
.tt h1{margin:0 0 10px;font-size:84px;line-height:1.04;letter-spacing:-.5px;-webkit-text-stroke:13px #000;paint-order:stroke fill}
.tt p{margin:6px 0 0;font-size:50px;line-height:1.12;-webkit-text-stroke:9px #000;paint-order:stroke fill}
#cta{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
#cta .r{display:inline-block;background:#FF1430;color:#fff;font:800 116px TT;padding:12px 48px 26px;border-radius:24px}
#cta .s{color:#fff;font:800 60px TT;line-height:1.1;margin:22px 40px 0;-webkit-text-stroke:10px #000;paint-order:stroke fill}
#fol{position:absolute;left:0;right:0;bottom:60px;text-align:center;color:#fff;font:800 58px TT;-webkit-text-stroke:10px #000;paint-order:stroke fill}
</style></head><body><img class="bg" id="bg"><div class="tt" id="tt"></div><div id="cta"></div><div id="fol"></div>
<script>const Q=new URLSearchParams(location.search); document.getElementById('bg').src=Q.get('img');
const t=document.getElementById('tt'); if(Q.get('h')){ t.innerHTML='<h1></h1>'; t.firstChild.textContent=Q.get('h'); if(Q.get('em')){const e=Q.get('em'); t.firstChild.innerHTML=t.firstChild.textContent.replace(e,'<span style="color:#FFEE00">'+e.toUpperCase()+'</span>');} for(const b of Q.getAll('b')){const p=document.createElement('p'); p.textContent=b; t.appendChild(p);}}
if(Q.get('cta')){const e=document.getElementById('cta');e.innerHTML='<div class="r"></div><div class="s"></div>';e.querySelector('.r').textContent=Q.get('cta');e.querySelector('.s').textContent=Q.get('ctas');}
if(Q.get('fol')) document.getElementById('fol').textContent=Q.get('fol');
</script></body></html>
