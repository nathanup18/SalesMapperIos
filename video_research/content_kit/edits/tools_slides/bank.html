<!doctype html><html><head><meta charset="utf-8"><style>
/* Generic banking app screen: no real bank name or logo. */
html,body{margin:0;width:540px;height:720px;overflow:hidden;font-family:Inter;background:#f2f3f7;color:#14181f}
.top{background:linear-gradient(160deg,#0d2a5c,#123d82);color:#fff;padding:22px 26px 70px}
.sb{display:flex;justify-content:space-between;font:600 15px Inter;opacity:.95}
.hd{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.hd .t{font:700 22px Inter}.hd .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font:700 14px Inter}
.card{background:#fff;border-radius:20px;margin:-50px 18px 0;padding:22px 24px;box-shadow:0 8px 24px rgba(13,42,92,.12)}
.k{font:600 14px Inter;color:#6b7280;letter-spacing:.3px}.acct{font:700 18px Inter;margin-top:2px}
.bal{font:800 46px Inter;letter-spacing:-1.5px;margin-top:14px}.bal small{font-size:28px}
.sub{font:500 14px Inter;color:#6b7280;margin-top:2px}
.btns{display:flex;gap:10px;margin-top:18px}.btns span{flex:1;text-align:center;background:#eaf0fb;color:#123d82;border-radius:12px;padding:11px 0;font:700 14px Inter}
.list{margin:18px 18px 0;background:#fff;border-radius:20px;padding:6px 20px}
.lh{font:700 15px Inter;padding:14px 0 6px;color:#14181f}
.row{display:flex;align-items:center;padding:12px 0;border-top:1px solid #eef0f4}
.ic{width:36px;height:36px;border-radius:50%;background:#e6f6ec;color:#16a34a;display:flex;align-items:center;justify-content:center;font:800 18px Inter;margin-right:12px}
.n{font:600 15px Inter}.d{font:500 12px Inter;color:#8a8f98}.a{margin-left:auto;font:700 16px Inter;color:#16a34a}
</style></head><body>
<div class="top"><div class="sb"><span>9:41</span><span>●●● 100%</span></div>
 <div class="hd"><div class="t">Accounts</div><div class="av">●</div></div></div>
<div class="card"><div class="k">CHECKING</div><div class="acct">Everyday Checking ••7214</div>
 <div class="bal">$312,480<small>.17</small></div><div class="sub">Available balance</div>
 <div class="btns"><span>Transfer</span><span>Pay</span><span>Deposit</span></div></div>
<div class="list"><div class="lh">Recent activity</div>
 <div class="row"><div class="ic">+</div><div><div class="n">Commission deposit</div><div class="d">Nov 21</div></div><div class="a">+$18,420.00</div></div>
 <div class="row"><div class="ic">+</div><div><div class="n">Commission deposit</div><div class="d">Nov 14</div></div><div class="a">+$21,960.00</div></div>
 <div class="row"><div class="ic">+</div><div><div class="n">Bonus</div><div class="d">Nov 7</div></div><div class="a">+$9,500.00</div></div></div>
</body></html>
