<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:TT;src:url(/root/.fonts/TikTokSans-800.ttf);font-weight:800}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;width:1080px;height:1440px}

svg{position:absolute;inset:0}
.tt{position:absolute;left:36px;right:36px;top:56px;text-align:center;color:#fff;font-family:TT;font-weight:800}

 <path d="M150 1150 C 150 960, 560 860, 820 885" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" opacity=".55"/>
 <path d="M150 1150 C 150 960, 560 860, 820 885" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 22" marker-end="url(#ah)"/></svg>
