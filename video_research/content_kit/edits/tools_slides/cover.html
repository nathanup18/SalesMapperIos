<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#fff;font-family:Inter}
.g{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px}
.g img{width:100%;height:100%;object-fit:cover;display:block}
#hook{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
#hook .b{display:inline-block;background:#000;color:#fff;border-radius:26px;padding:26px 44px 30px;max-width:1000px}
#hook .t{font:800 66px Inter;letter-spacing:-1.8px;line-height:1.04}
#hook .s{font:500 40px Inter;color:#d6d6d6;margin-top:10px}
</style></head><body>
<div class="g"><img src="bankphoto.png" style="object-position:50% 35%"><img src="celsius.png" style="object-position:50% 70%"><img src="map.png" style="object-position:50% 40%"><img src="rep.png"></div>
<div id="hook"><div class="b"><div class="t">10/10 door-to-door sales tools</div><div class="s">(that progressively make you more money)</div></div></div>
</body></html>
