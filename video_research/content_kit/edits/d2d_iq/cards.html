<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#title{position:absolute;left:40px;right:40px;top:178px;text-align:center;font-family:"Instrument Serif";font-size:92px;line-height:1;color:#fff;letter-spacing:-.5px;
 text-shadow:0 0 22px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.75)}
#card{position:absolute;left:140px;top:1372px;transform:scale(.78);transform-origin:50% 0;width:800px;height:440px;background:rgba(239,240,242,.96);box-sizing:border-box;font-family:Inter;color:#2b2e33}
.lbl{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase}
.cap{font-size:11.5px;line-height:1.32;color:#3d4148}
.abs{position:absolute}
.plus{position:absolute;font-family:Inter;font-weight:300;font-size:22px;color:#9aa0a8}
#name{position:absolute;left:210px;width:380px;top:16px;text-align:center;font-weight:600;font-size:17px;color:#16181b}
#dia{position:absolute;left:205px;top:44px;width:390px;height:228px}
#formula{position:absolute;left:0;right:0;top:300px;text-align:center}
#formula span{display:inline-block;font-family:"IBM Plex Mono";font-weight:500;font-size:16.5px;letter-spacing:1.4px;padding:10px 22px;border-radius:6px;border:1.6px solid;color:#1e2125}
#def{position:absolute;left:0;right:0;top:362px;text-align:center;font-style:italic;font-size:14.5px;color:#22252a}
</style></head><body>
<div id="title"></div>
<div id="card">
 <div class="abs lbl" style="left:24px;top:16px" data-acc>Detail view</div>
 <svg class="abs" style="left:24px;top:34px" width="120" height="120" id="detail"></svg>
 <div class="abs cap" style="left:24px;top:160px;width:150px;text-align:center" id="dcap"></div>
 <div class="abs lbl" style="left:24px;top:190px" data-acc>Side profile</div>
 <svg class="abs" style="left:24px;top:206px" width="180" height="20"><ellipse cx="45" cy="10" rx="44" ry="7" fill="none" stroke="#2b2e33" stroke-width="1"/><ellipse cx="45" cy="10" rx="24" ry="3.5" fill="none" stroke="#9aa0a8" stroke-width=".8"/>
  <g stroke="#6b7078" stroke-width=".9"><line x1="100" y1="10" x2="178" y2="10"/><line x1="100" y1="5" x2="100" y2="15"/><line x1="178" y1="5" x2="178" y2="15"/>
  <line x1="113" y1="7" x2="113" y2="13"/><line x1="126" y1="7" x2="126" y2="13"/><line x1="152" y1="7" x2="152" y2="13"/><line x1="165" y1="7" x2="165" y2="13"/></g><circle cx="139" cy="10" r="3.2" data-fill/></svg>
 <div class="abs lbl" style="left:24px;top:236px" data-acc>Material</div>
 <svg class="abs" style="left:24px;top:252px" width="20" height="20"><circle cx="9" cy="9" r="8" data-fill/></svg>
 <div class="abs cap" style="left:24px;top:274px" id="mat"></div>
 <div id="name"></div><svg id="dia" viewBox="0 0 390 228"></svg>
 <div class="abs lbl" style="left:618px;top:16px" data-acc>Scale study</div>
 <svg class="abs" style="left:618px;top:34px" width="120" height="40"><circle cx="11" cy="20" r="9" fill="none" stroke="#2b2e33"/><circle cx="40" cy="20" r="14" fill="none" stroke="#2b2e33"/><circle cx="78" cy="20" r="19" fill="none" stroke="#2b2e33"/><path d="M78 11v18M69 20h18" stroke="#2b2e33" stroke-width="1.2"/></svg>
 <div class="abs cap" style="left:618px;top:80px;width:160px" id="scale"></div>
 <div class="abs lbl" style="left:618px;top:124px" data-acc>Touchpoint</div>
 <div class="abs cap" style="left:618px;top:141px;width:160px" id="touch"></div>
 <div class="abs lbl" style="left:618px;top:186px" data-acc id="l3"></div>
 <div class="abs cap" style="left:618px;top:203px;width:162px" id="t3"></div>
 <div id="formula"><span></span></div><div id="def"></div>
 <div class="plus" style="left:12px;top:398px">+</div><div class="plus" style="right:12px;top:398px">+</div>
</div>
<script>
const T = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const A = T.acc, tint = A + '22', ink = '#2b2e33', mute = '#9aa0a8';
document.getElementById('title').textContent = T.title;
document.getElementById('name').textContent = T.name;
for (const [id, v] of Object.entries({dcap: T.dcap, mat: T.mat, scale: T.scale, touch: T.touch, l3: T.l3, t3: T.t3, def: T.def})) document.getElementById(id).innerHTML = v;
document.querySelectorAll('[data-acc]').forEach(e => e.style.color = A);
document.querySelectorAll('[data-fill]').forEach(e => e.setAttribute('fill', A));
const f = document.querySelector('#formula span'); f.textContent = T.formula; f.style.borderColor = A; f.style.background = A + '1a';
const mono = (x, y, s, t, c = ink, a = 'middle') => `<text x="${x}" y="${y}" font-family="IBM Plex Mono" font-size="${s}" letter-spacing="1.2" fill="${c}" text-anchor="${a}">${t}</text>`;
const sans = (x, y, s, t, c = ink, w = 400, a = 'middle') => `<text x="${x}" y="${y}" font-family="Inter" font-weight="${w}" font-size="${s}" fill="${c}" text-anchor="${a}">${t}</text>`;
const door = (x, y, w, h, on, open) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${on ? A : 'none'}" fill-opacity="${on ? .85 : 0}" stroke="${on ? A : ink}" stroke-width="1.2"/>` +
  (open ? `<path d="M${x + w} ${y} l${w * .45} ${h * .12} v${h * .76} l-${w * .45} ${h * .12}z" fill="${A}" fill-opacity=".35" stroke="${A}"/>` : `<circle cx="${x + w * .78}" cy="${y + h * .55}" r="1.6" fill="${on ? '#fff' : ink}"/>`);
const house = (x, y, s, on, dim) => `<g opacity="${dim ? .45 : 1}"><path d="M${x} ${y + s * .45} L${x + s / 2} ${y} L${x + s} ${y + s * .45} V${y + s} H${x} Z" fill="${on ? A : 'none'}" fill-opacity="${on ? .85 : 0}" stroke="${on ? A : ink}" stroke-width="1.2"/>
  <rect x="${x + s * .4}" y="${y + s * .62}" width="${s * .2}" height="${s * .38}" fill="${on ? '#fff' : 'none'}" stroke="${on ? '#fff' : ink}" stroke-width="1"/></g>`;
const check = (x, y, s, c = '#fff') => `<path d="M${x} ${y} l${s * .35} ${s * .35} l${s * .65} -${s * .7}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
const person = (x, y, c = ink) => `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="${c}" stroke-width="1.3"/><path d="M${x - 12} ${y + 24} q12 -18 24 0" fill="none" stroke="${c}" stroke-width="1.3"/>`;
const arrow = (x1, y1, x2, y2, c = ink, dash = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.3" ${dash ? `stroke-dasharray="${dash}"` : ''}/><path d="M${x2} ${y2} l-7 -4 v8z" fill="${c}" transform="rotate(${Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI} ${x2} ${y2})"/>`;
const box = (x, y, w, h, t, on, dash) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${on ? A : A}" fill-opacity="${on ? .9 : .12}" stroke="${on ? A : A}" stroke-width="1.3" ${dash ? 'stroke-dasharray="4 3"' : ''}/>` + mono(x + w / 2, y + h / 2 + 4, 11, t, on ? '#fff' : ink);
const big = (x, y, n, sub) => sans(x, y, 38, n, '#16181b', 700) + mono(x, y + 20, 10, sub, A);
const D = {
 knock: () => { let s = ''; for (let i = 0; i < 9; i++) s += door(14 + i * 41, 40, 26, 48, i < 7, false); return s + `<path d="M14 104 v6 h357 v-6" fill="none" stroke="${mute}"/>` + mono(192, 126, 10, 'ONE HOUR', mute) + big(195, 186, '42', 'DOORS PER HOUR'); },
 contact: () => { let s = ''; for (let i = 0; i < 10; i++) s += door(12 + (i % 5) * 76, 24 + Math.floor(i / 5) * 70, 26, 50, [1, 4, 7].includes(i), [1, 4, 7].includes(i)); return s + big(195, 196, '30%', 'DOORS THAT OPEN'); },
 jones: () => { let s = ''; [0, 1, 2, 3, 4].forEach(i => s += house(18 + i * 74, 60, 54, i === 2 || i === 3, i === 0)); s += check(166, 102, 22); s += arrow(222, 46, 262, 46, A) + arrow(168, 46, 128, 46, A, '3 3');
   return s + mono(195, 30, 10, 'ONE YES', A) + mono(195, 150, 10, 'NEIGHBORS FOLLOW', mute) + big(195, 202, '2×', 'EASIER NEXT DOOR'); },
 pitch: () => `<path d="M30 30 H360 L300 92 H90 Z" fill="${A}" fill-opacity=".14" stroke="${A}"/><path d="M90 100 H300 L250 150 H140 Z" fill="${A}" fill-opacity=".85" stroke="${A}"/>` +
   mono(195, 66, 11, 'CONTACTS') + mono(195, 130, 11, 'FULL PITCHES', '#fff') + big(195, 204, '55%', 'MAKE IT PAST THE BRUSH-OFF'),
 ticket: () => { const h = [60, 90, 48, 120, 76, 98, 66]; let s = ''; h.forEach((v, i) => s += `<rect x="${30 + i * 48}" y="${150 - v}" width="30" height="${v}" fill="${A}" fill-opacity="${i === 3 ? .9 : .35}"/>`);
   return s + `<line x1="20" y1="${150 - 80}" x2="370" y2="${150 - 80}" stroke="${ink}" stroke-dasharray="5 4"/>` + mono(370, 62, 10, 'AVERAGE', ink, 'end') + `<line x1="20" y1="150" x2="370" y2="150" stroke="${ink}"/>` + big(195, 198, '$1,240', 'PER SALE'); },
 rpk: () => { let s = ''; const v = ['$0', '$0', '$0', '$48', '$0', '$0', '$0', '$26']; v.forEach((t, i) => { s += door(16 + i * 46, 36, 26, 46, t !== '$0', false) + mono(29 + i * 46, 104, 10, t, t !== '$0' ? A : mute); });
   return s + `<line x1="16" y1="118" x2="368" y2="118" stroke="${mute}"/>` + big(195, 180, '$7.40', 'EVERY KNOCK, EVEN THE NO’S'); },
 assume: () => { let s = ''; const d = ['M', 'T', 'W', 'T', 'F']; d.forEach((t, i) => { const on = i === 3; s += `<rect x="${40 + i * 64}" y="40" width="54" height="62" rx="4" fill="${A}" fill-opacity="${on ? .9 : .1}" stroke="${A}"/>` + mono(67 + i * 64, 64, 11, t, on ? '#fff' : ink) + mono(67 + i * 64, 88, 13, 17 + i, on ? '#fff' : ink); });
   return s + `<rect x="58" y="128" width="274" height="34" rx="17" fill="#fff" stroke="${ink}" stroke-width="1"/>` + sans(195, 150, 13, '“So we’ll get you in Thursday.”', ink, 500) + mono(195, 196, 10, 'NO “IF.” JUST “WHEN.”', A); },
 onecall: () => `<line x1="20" y1="90" x2="370" y2="90" stroke="${ink}"/><circle cx="60" cy="90" r="18" fill="${A}"/>` + check(52, 90, 16) + mono(60, 132, 10, 'VISIT 1', A) +
   [170, 260, 350].map((x, i) => `<circle cx="${x}" cy="90" r="14" fill="none" stroke="${mute}" stroke-dasharray="3 3"/>` + mono(x, 132, 10, '“LATER”', mute)).join('') + `<path d="M150 70 l40 40 M190 70 l-40 40" stroke="${mute}" stroke-width="1"/>` + big(195, 196, '1', 'VISIT. THAT’S THE WINDOW.'),
 puppy: () => box(20, 60, 110, 56, 'TRY IT') + arrow(136, 88, 182, 88, A) + house(196, 50, 66, true) + check(214, 92, 26) + arrow(270, 88, 312, 88, A) + box(318, 60, 64, 56, 'KEEP', true) +
   mono(195, 30, 10, 'GIVING IT BACK FEELS LIKE A LOSS', mute) + big(195, 186, 'Free', 'TRIAL, THEN THE ASK'),
 take: () => box(150, 50, 110, 60, 'THE OFFER', true) + arrow(266, 80, 340, 80, A) + `<rect x="270" y="50" width="110" height="60" rx="3" fill="none" stroke="${A}" stroke-dasharray="4 3"/>` + person(70, 64) + arrow(98, 80, 140, 80, ink) +
   mono(70, 128, 10, 'HOMEOWNER', mute) + mono(320, 128, 10, 'PULLED BACK', A) + big(195, 196, '↩', 'THEY LEAN IN'),
 tie: () => `<line x1="20" y1="90" x2="370" y2="90" stroke="${ink}"/>` + [70, 150, 230, 310].map((x, i) => `<circle cx="${x}" cy="90" r="13" fill="${A}"/>` + check(x - 6, 90, 12) + mono(x, 66, 10, '…RIGHT?', A)).join('') +
   mono(20, 116, 10, 'PITCH START', mute, 'start') + mono(370, 116, 10, 'CLOSE', mute, 'end') + big(195, 190, '4', 'SMALL YESES BEFORE THE BIG ONE'),
 feel: () => [['FEEL', '“I get it.”'], ['FELT', '“Others did too.”'], ['FOUND', '“Here’s what they found.”']].map(([k, q], i) => box(14 + i * 128, 50, 106, 54, k, i === 2) + sans(67 + i * 128, 128, 10.5, q, ink, 400) + (i < 2 ? arrow(122 + i * 128, 77, 140 + i * 128, 77, A) : '')).join('') +
   big(195, 198, '3', 'STEPS, IN THIS ORDER'),
 warm: () => person(50, 58) + mono(50, 110, 10, 'REP') + arrow(76, 70, 150, 70, A) + `<rect x="152" y="48" width="86" height="44" rx="22" fill="${A}" fill-opacity=".9"/>` + mono(195, 75, 11, 'INTRO', '#fff') + arrow(240, 70, 314, 70, A) + person(340, 58, A) + mono(340, 110, 10, 'CLOSER', A) +
   house(170, 112, 50, false) + big(195, 204, '0', 'TIME FOR THEM TO COOL OFF'),
 trial: () => `<path d="M60 150 A135 135 0 0 1 330 150" fill="none" stroke="${mute}" stroke-width="10"/><path d="M60 150 A135 135 0 0 1 252 25" fill="none" stroke="${A}" stroke-width="10"/>` +
   `<line x1="195" y1="150" x2="262" y2="62" stroke="${ink}" stroke-width="2.4"/><circle cx="195" cy="150" r="6" fill="${ink}"/>` + mono(56, 172, 10, 'COLD', mute) + mono(334, 172, 10, 'READY', mute) + mono(195, 196, 11, '“HOW DOES THAT SOUND SO FAR?”', A),
 claw: () => `<path d="M50 140 Q195 -20 340 140" fill="none" stroke="${A}" stroke-width="2"/>` + `<circle cx="50" cy="140" r="16" fill="${A}"/>` + mono(50, 145, 12, '$', '#fff') + mono(50, 176, 10, 'PAID', A) +
   `<circle cx="340" cy="140" r="16" fill="none" stroke="${A}" stroke-width="1.6"/><path d="M332 132 l16 16 M348 132 l-16 16" stroke="${A}" stroke-width="2"/>` + mono(340, 176, 10, 'CANCELLED', A) + arrow(300, 162, 92, 162, ink, '4 3') +
   big(195, 116, '−$', 'COMMISSION TAKEN BACK'),
 turf: () => `<rect x="20" y="20" width="350" height="170" fill="none" stroke="${ink}"/>` + `<path d="M20 100 L150 84 L196 20 M150 84 L232 190 M232 190 L280 96 L370 110 M196 20 L280 96" fill="none" stroke="${A}" stroke-width="2"/>` +
   [[80, 54], [96, 150], [260, 46], [320, 160], [200, 120]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="9" fill="${A}" fill-opacity="${.35 + i * .12}"/>` + mono(x, y + 4, 9, 'R' + (i + 1), '#fff')).join('') + mono(195, 214, 10, 'ONE REP PER ZONE. NO OVERLAP.', A),
};
document.getElementById('dia').innerHTML = D[T.dia]();
const G = { // detail-view glyphs
 door: `<rect x="44" y="30" width="32" height="60" rx="2" fill="${A}" fill-opacity=".85"/><circle cx="69" cy="62" r="2" fill="#fff"/>`, house: house(32, 30, 56, true),
 bars: `<rect x="34" y="60" width="14" height="30" fill="${A}" fill-opacity=".4"/><rect x="53" y="40" width="14" height="50" fill="${A}"/><rect x="72" y="52" width="14" height="38" fill="${A}" fill-opacity=".4"/>`,
 money: `<circle cx="60" cy="60" r="24" fill="${A}"/>` + `<text x="60" y="68" font-family="Inter" font-weight="700" font-size="24" fill="#fff" text-anchor="middle">$</text>`,
 check: `<circle cx="60" cy="60" r="24" fill="${A}"/>` + check(49, 60, 22), cal: `<rect x="36" y="38" width="48" height="46" rx="4" fill="${A}"/><rect x="36" y="38" width="48" height="12" fill="${ink}" fill-opacity=".25"/>`,
 arrow: arrow(30, 60, 90, 60, A), person: person(60, 46, A), gauge: `<path d="M32 76 A28 28 0 0 1 88 76" fill="none" stroke="${A}" stroke-width="6"/><line x1="60" y1="76" x2="74" y2="56" stroke="${ink}" stroke-width="2"/>`,
 map: `<rect x="34" y="34" width="52" height="52" fill="none" stroke="${ink}"/><path d="M34 62 L60 56 L72 34 M60 56 L68 86" stroke="${A}" stroke-width="2" fill="none"/>`
};
document.getElementById('detail').innerHTML = `<circle cx="60" cy="60" r="56" fill="none" stroke="${ink}" stroke-width="1.2"/>` + G[T.glyph];
</script></body></html>
