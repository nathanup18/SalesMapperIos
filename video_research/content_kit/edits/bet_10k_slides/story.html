<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:TT;src:url(/root/.fonts/TikTokSans-800.ttf);font-weight:800}
@font-face{font-family:TT;src:url(/root/.fonts/TikTokSans-600.ttf);font-weight:600}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#000;font-family:Inter}
img.bg{position:absolute;inset:0;width:1080px;height:1440px;object-fit:cover}
.o{color:#fff;font-family:TT;font-weight:800;paint-order:stroke fill;text-align:center}
#top{position:absolute;left:40px;right:40px;top:150px}
#top .t{font-size:96px;-webkit-text-stroke:14px #000;line-height:1}
#top .t small{font-size:52px;-webkit-text-stroke:10px #000}
#top .s{font-size:56px;-webkit-text-stroke:10px #000;margin-top:14px;line-height:1.12}
#top .k{font-size:40px;-webkit-text-stroke:8px #000;margin-top:12px;color:#FFE14D}
#top .big{font-size:88px;-webkit-text-stroke:13px #000;line-height:1.08}
/* SalesMapper-style progress card */
#hud{position:absolute;left:60px;right:60px;bottom:60px;background:#fff;border-radius:34px;padding:28px 36px 32px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#hud .row{display:flex;justify-content:space-between;align-items:flex-end}
#hud .k{font:600 26px Inter;color:#6b7280;letter-spacing:.3px;text-transform:uppercase}
#hud .v{font:800 64px Inter;color:#111;letter-spacing:-1.5px;line-height:1.05}
#hud .bar{height:22px;border-radius:11px;background:#e5e7eb;margin-top:20px;overflow:hidden}
#hud .bar i{display:block;height:100%;border-radius:11px;background:linear-gradient(90deg,#34C759,#16a34a)}
#hud .goal{display:flex;justify-content:space-between;font:600 24px Inter;color:#6b7280;margin-top:10px}
/* iMessage-style texts */
.msgs{position:absolute;left:60px;right:60px;display:flex;flex-direction:column;gap:14px}
.m{max-width:760px;align-self:flex-start}
.m .who{font:600 24px Inter;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);margin:0 0 6px 18px}
.m .b{background:#E9E9EB;color:#111;font:500 40px Inter;padding:18px 28px;border-radius:34px;line-height:1.2;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.m.me{align-self:flex-end}.m.me .b{background:#0A84FF;color:#fff}
.chat{background:rgba(28,28,30,.96);border-radius:30px;padding:22px 24px 26px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.chat .h{font:700 28px Inter;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.chat .h span{font:500 22px Inter;color:#9ca3af}
.chat .m .b{background:#3A3A3C;color:#fff;font-size:36px}
.chat .m .who{text-shadow:none;color:#9ca3af;font-size:22px}
/* SalesMapper cards */
.card{position:absolute;left:60px;right:60px;background:#fff;border-radius:34px;padding:30px 34px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.card .hd{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.card .hd img{width:64px;height:64px;border-radius:16px}
.card .hd .n{font:800 38px Inter;color:#111}.card .hd .d{font:500 24px Inter;color:#6b7280}
.lb .r{display:flex;align-items:center;gap:20px;padding:16px 0;border-top:2px solid #f0f1f3;font:600 34px Inter;color:#111}
.lb .r .p{width:50px;font:800 32px Inter;color:#9ca3af}
.lb .r .a{width:58px;height:58px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font:800 24px Inter;color:#374151}
.lb .r .x{margin-left:auto;font:800 36px Inter}
.lb .r.me{background:#eef6ff;margin:0 -16px;padding:16px;border-radius:18px;border-top:0}
.lb .r.me .a{background:#0A84FF;color:#fff}
.lh .map{height:170px;border-radius:22px;overflow:hidden;position:relative;margin-bottom:12px}
.lh .map img{width:100%;height:100%;object-fit:cover}
.lh .pin{position:absolute;width:46px;height:46px;border-radius:50%;background:#FF9F0A;border:5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.lh .r{display:flex;justify-content:space-between;padding:10px 0;border-top:2px solid #f0f1f3;font:600 32px Inter;color:#111}
.lh .r span{font:500 26px Inter;color:#FF9F0A}
.sum .g{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sum .c{background:#f6f7f9;border-radius:22px;padding:22px 26px}
.sum .c .k{font:600 24px Inter;color:#6b7280;text-transform:uppercase}
.sum .c .v{font:800 58px Inter;color:#111;letter-spacing:-1px}
.sum .c .d{font:600 24px Inter;color:#16a34a;margin-top:4px}

/* iOS Live Activity style progress (replaces the white card) */
#hud{position:absolute;left:30px;right:30px;bottom:44px;border-radius:62px;background:rgba(16,16,18,.80);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);padding:34px 46px 38px;color:#fff;box-shadow:none}
#hud .la-top{display:flex;align-items:center;gap:16px;font:600 30px Inter;color:rgba(255,255,255,.82)}
#hud .la-top img{width:50px;height:50px;border-radius:12px}
#hud .la-top .r{margin-left:auto;font:500 28px Inter;color:rgba(255,255,255,.55)}
#hud .nums{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
#hud .amt{font:700 80px Inter;letter-spacing:-2px;font-variant-numeric:tabular-nums}
#hud .dr{font:600 38px Inter;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
#hud .bar{height:14px;border-radius:7px;background:rgba(255,255,255,.18);margin-top:18px;overflow:hidden}
#hud .bar i{display:block;height:100%;border-radius:7px;background:#30D158}
#hud .sub{display:flex;justify-content:space-between;font:500 26px Inter;color:rgba(255,255,255,.55);margin-top:12px}
/* iOS lock-screen notification banners */
.nts{position:absolute;left:30px;right:30px;display:flex;flex-direction:column;gap:14px}
.nt{display:flex;gap:26px;align-items:flex-start;border-radius:54px;padding:30px 34px;-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);background:rgba(246,246,246,.74);color:#111}
.dark .nt{background:rgba(44,44,46,.66);color:#fff}
.nt .ic{width:92px;height:92px;border-radius:21px;flex:none;background:linear-gradient(#5BF675,#0CBD2A);display:flex;align-items:center;justify-content:center}
.nt .bd{flex:1;min-width:0}
.nt .rw{display:flex;justify-content:space-between;align-items:baseline}
.nt .s{font:600 34px Inter}.nt .t{font:400 28px Inter;opacity:.55}
.nt .m{font:400 34px Inter;line-height:1.25;margin-top:4px}
.lh .why{margin-top:12px;background:#FFF4E5;color:#B45309;border-radius:16px;padding:14px 18px;font:600 26px Inter}

/* iOS 18 communication notifications (contact monogram + Messages badge, stacked threads) */
.nts{position:absolute;left:28px;right:28px;display:flex;flex-direction:column;gap:16px}
.st{position:relative}
.nt{position:relative;z-index:3;display:flex;gap:24px;align-items:center;border-radius:50px;padding:26px 30px 28px 26px;-webkit-backdrop-filter:blur(36px) saturate(1.9);backdrop-filter:blur(36px) saturate(1.9);background:rgba(245,245,245,.72);color:#000}
.dark .nt{background:rgba(48,48,52,.62);color:#fff}
.ly{position:absolute;left:22px;right:22px;height:40px;border-radius:0 0 40px 40px;-webkit-backdrop-filter:blur(36px);backdrop-filter:blur(36px);background:rgba(235,235,235,.55)}
.dark .ly{background:rgba(58,58,62,.5)}
.ly.l1{bottom:-20px;z-index:2}.ly.l2{left:44px;right:44px;bottom:-38px;z-index:1;opacity:.8}
.av{position:relative;width:96px;height:96px;flex:none}
.mono{width:96px;height:96px;border-radius:50%;background:linear-gradient(#A6ACB9,#858A96);display:flex;align-items:center;justify-content:center;font:600 40px -apple-system,Inter;color:#fff;letter-spacing:.5px}
.grp .mono{position:absolute;width:66px;height:66px;font-size:26px;border:3px solid rgba(245,245,245,.9)}
.dark .grp .mono{border-color:rgba(48,48,52,.9)}
.grp .mono.a{left:0;top:0}.grp .mono.b{right:0;bottom:0;background:linear-gradient(#8E97A6,#6E7480)}
.badge{position:absolute;right:-6px;bottom:-6px;width:42px;height:42px;border-radius:11px;background:linear-gradient(#5BF675,#0CBD2A);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(245,245,245,.85)}
.dark .badge{box-shadow:0 0 0 3px rgba(48,48,52,.85)}
.nt .bd{flex:1;min-width:0}
.nt .rw{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.nt .s{font:600 33px Inter;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt .t{font:400 27px Inter;opacity:.5;flex:none}
.nt .m{font:400 33px Inter;line-height:1.26;margin-top:3px;letter-spacing:-.2px}
.nt .more{font:400 26px Inter;opacity:.5;margin-top:6px}
</style></head><body class=""><img class="bg" id="bg"><div id="top"></div><div id="x"></div><div id="hud"></div>
<script>
const Q=new URLSearchParams(location.search), J=JSON.parse(Q.get('j')), fmt=n=>'$'+n.toLocaleString('en-US');
document.getElementById('bg').src=J.img;
document.getElementById('top').innerHTML=(J.time?`<div class="o t">${J.time}${J.tag?` <small>(${J.tag})</small>`:''}</div>`:'')+(J.big?`<div class="o big">${J.big}</div>`:'')+(J.stakes?`<div class="o k">${J.stakes}</div>`:'')+(J.line?`<div class="o s">${J.line}</div>`:'')+(J.sub?`<div class="o k" style="color:#fff;font-size:42px">${J.sub}</div>`:'');
if(J.made!=null||J.madeText){const p=J.pct!=null?J.pct:Math.min(100,J.made/100);document.getElementById('hud').innerHTML=`<div class="la-top"><img src="icon.png">SalesMapper · On shift<span class="r">${J.time}</span></div><div class="nums"><div class="amt">${J.madeText||fmt(J.made)}</div><div class="dr">${J.doors} doors</div></div><div class="bar"><i style="width:${p}%"></i></div><div class="sub"><span>Goal $10,000</span><span>${Math.round(p)}%</span></div>`;} else document.getElementById('hud').remove();
const x=document.getElementById('x');
const bdg=`<div class="badge"><svg width="26" height="24" viewBox="0 0 58 54"><path d="M29 3C14 3 3 12.6 3 24.6c0 6.7 3.5 12.7 9 16.7-.4 3.6-2.2 7-5 9.6 5.1.2 10-1.5 13.6-4.5 2.6.7 5.4 1 8.4 1 15 0 26-9.6 26-21.4S44 3 29 3z" fill="#fff"/></svg></div>`;
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=(who,grp)=>grp?`<div class="av grp"><div class="mono a">${ini(grp[0])}</div><div class="mono b">${ini(grp[1])}</div>${bdg}</div>`:`<div class="av"><div class="mono">${ini(who)}</div>${bdg}</div>`;
const nt=(title,msg,grp,t,more)=>`<div class="st"><div class="nt">${av(title,grp)}<div class="bd"><div class="rw"><div class="s">${title}</div><div class="t">${t||'now'}</div></div><div class="m">${msg}</div>${more?`<div class="more">${more} more message${more>1?'s':''}</div>`:''}</div></div>${more?'<div class="ly l1"></div>'+(more>1?'<div class="ly l2"></div>':''):''}</div>`;
const bub=(m)=>nt(m.who==='Manager'?'Boss':m.who,m.t,null,m.ago);
if(J.dark) document.body.className='dark';
if(J.texts) x.innerHTML+=`<div class="nts" style="top:${J.ty||560}px">${J.texts.map(bub).join('')}</div>`;
if(J.chat){const L=J.chat[J.chat.length-1];x.innerHTML+=`<div class="nts" style="top:${J.cy||560}px">${nt('D2D Squad 🏠',L.who+': '+L.t,J.chat.map(c=>c.who).concat(['Sam']).slice(0,2),'now',J.chat.length-1)}</div>`;}
if(J.lb) x.innerHTML+=`<div class="card lb" style="top:${J.ly||540}px"><div class="hd"><img src="icon.png"><div><div class="n">Team · Today</div><div class="d">SalesMapper leaderboard</div></div></div>${J.lb.map((r,i)=>`<div class="r ${r.me?'me':''}"><div class="p">${i+1}</div><div class="a">${r.i}</div>${r.n}<div class="x">${fmt(r.v)}</div></div>`).join('')}</div>`;
if(J.lh) x.innerHTML+=`<div class="card lh" style="top:${J.hy||470}px"><div class="hd"><img src="icon.png"><div><div class="n">Lead Hunter</div><div class="d">new movers near you · moving + utility signals</div></div></div><div class="map"><img src="s_map.png"><div class="pin" style="left:18%;top:30%"></div><div class="pin" style="left:42%;top:58%"></div><div class="pin" style="left:63%;top:22%"></div><div class="pin" style="left:80%;top:62%"></div></div>${J.lh.map(r=>`<div class="r">${r[0]}<span>${r[1]}</span></div>`).join('')}<div class="why">just moved in = no provider yet + already spending</div></div>`;
if(J.sum) x.innerHTML+=`<div class="card sum" style="top:${J.sy||430}px"><div class="hd"><img src="icon.png"><div><div class="n">Day Summary</div><div class="d">Saturday · 10:46 AM to 8:53 PM</div></div></div><div class="g">${J.sum.map(c=>`<div class="c"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="d">${c[2]||''}</div></div>`).join('')}</div></div>`;
</script></body></html>
