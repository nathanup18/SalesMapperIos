<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MW;src:url(/root/.fonts/Merriweather-var.ttf);font-weight:400}
@font-face{font-family:MW;src:url(/root/.fonts/Merriweather-900.ttf);font-weight:900}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;font-family:MW;color:#111;
 background:#ececec radial-gradient(#d9d9d9 1.2px,transparent 1.3px) 0 0/14px 14px}
.w{position:absolute;left:80px;right:60px;top:50%;transform:translateY(-50%)}
.h{font-weight:900;font-size:100px;line-height:1.2;letter-spacing:-2px}
/* marker-style highlight: sits on the lower 70% of the letters, a little past each side */
.y{background:linear-gradient(to bottom,transparent 22%,#FFEE00 22%,#FFEE00 94%,transparent 94%);padding:0 12px;margin:0 -12px;
   -webkit-box-decoration-break:clone;box-decoration-break:clone}
.s{font-weight:400;font-size:52px;line-height:1.3;margin-top:44px;color:#3a3a3a}
.hd{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-weight:400;font-size:34px;color:#8a8a8a}
</style></head><body><div class="w">
<div class="h">Would You Have<br><span class="y">Taken the Bet?</span></div>
<div class="s">(save this for your next Saturday)</div>

</div>
<div style="position:absolute;left:80px;right:60px;bottom:120px"><div class="h" style="font-size:76px">Follow for More</div><div class="s" style="margin-top:10px">(more door-to-door tips like this)</div></div><div class="hd" id="hd"></div>
<script>const Q=new URLSearchParams(location.search); if(Q.get('handle')) document.getElementById('hd').textContent=Q.get('handle');</script>
</body></html>
