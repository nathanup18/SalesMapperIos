<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter}
#hook{position:absolute;left:0;right:0;top:150px;text-align:center}
#hook .b{display:inline-block;background:#fff;color:#000;border-radius:22px;padding:22px 40px 26px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#hook .t{font:800 66px Inter;letter-spacing:-1.5px;line-height:1.05}
#hook .s{font:500 40px Inter;color:#333;margin-top:6px}
#lab{position:absolute;left:0;right:0;top:170px;text-align:center}
#lab .b{display:inline-block;background:#fff;color:#000;border-radius:16px;padding:14px 30px;font:800 54px Inter;letter-spacing:-1px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#lab .d{display:inline-block;margin-top:12px;background:#E5202E;color:#fff;border-radius:10px;padding:6px 18px;font:700 30px Inter}
#w{position:absolute;left:30px;right:30px;top:1000px;text-align:center;font:600 104px Inter;letter-spacing:-1px;color:#fff;
 text-shadow:0 0 26px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.85)}
#w.red span{display:inline-block;background:#FF1430;padding:8px 34px 16px;border-radius:14px;text-shadow:none}
</style></head><body><div id="hook"></div><div id="lab"></div><div id="w"></div>
<script>const Q=new URLSearchParams(location.search);
if(Q.get('ht')) document.getElementById('hook').innerHTML=`<div class="b"><div class="t">${Q.get('ht')}</div><div class="s">${Q.get('hs')}</div></div>`;
if(Q.get('lt')) document.getElementById('lab').innerHTML=`<div class="b">${Q.get('lt')}</div><br><div class="d">${Q.get('ld')}</div>`;
const w=document.getElementById('w'); if(Q.get('r')){w.className='red';w.innerHTML='<span></span>';w.firstChild.textContent=Q.get('w');} else w.textContent=Q.get('w')||'';
</script></body></html>
