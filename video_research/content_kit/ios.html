<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:360px;height:640px;overflow:hidden;background:#fff;font-family:Inter,-apple-system,system-ui,sans-serif;color:#000;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
.abs{position:absolute}
.status{position:absolute;left:0;right:0;top:0;height:44px;z-index:9}
.status .time{position:absolute;left:30px;top:14px;font-weight:600;font-size:15.5px;letter-spacing:-.3px}
.island{position:absolute;left:50%;top:9px;width:108px;height:31px;margin-left:-54px;border-radius:16px;background:#000}
.home{position:absolute;left:50%;bottom:7px;width:122px;height:5px;margin-left:-61px;border-radius:3px;background:#000;z-index:9}
/* iMessage */
.bub{position:absolute;max-width:238px;padding:8px 13px 9px;border-radius:19px;font-size:16.5px;line-height:1.28;letter-spacing:-.25px}
.in{left:12px;background:#E9E9EB;color:#000}
.out{right:12px;background:#0A84FF;color:#fff}
.in::before{content:"";position:absolute;left:-6px;bottom:0;width:18px;height:17px;background:#E9E9EB;border-bottom-right-radius:16px}
.in::after{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:18px;background:#fff;border-bottom-right-radius:10px}
.out::before{content:"";position:absolute;right:-6px;bottom:0;width:18px;height:17px;background:#0A84FF;border-bottom-left-radius:16px}
.out::after{content:"";position:absolute;right:-10px;bottom:0;width:10px;height:18px;background:#fff;border-bottom-left-radius:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8E8E93;margin:0 2px}
/* Reminders */
.ritem{position:absolute;left:0;right:0;height:52px;display:flex;align-items:flex-start;padding:12px 18px 0 18px;gap:12px}
.ritem .c{flex:none;width:23px;height:23px;border-radius:50%;border:1.6px solid #C7C7CC;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.ritem .t{font-size:16.5px;line-height:1.25;border-bottom:.5px solid #D1D1D6;flex:1;padding-bottom:12px;min-height:40px}
</style></head><body><div id="s"></div>
<script>
const Q=new URLSearchParams(location.search), SCENE=Q.get('scene'), qn=(k,d)=>Q.has(k)?parseFloat(Q.get(k)):d;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t, prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=t=>1-Math.pow(1-clamp(t),3), spring=t=>{t=clamp(t);return 1-Math.exp(-7*t)*Math.cos(8*t)};
const S=document.getElementById('s'); const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;S.appendChild(e);return e};
const statusBar=(dark=false)=>el(`<div class="status"><div class="time" style="color:${dark?'#fff':'#000'}">9:41</div><div class="island"></div>
 <svg class="abs" style="right:70px;top:16px" width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
 <svg class="abs" style="right:48px;top:16px" width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 10.5l2-2.4a3 3 0 00-4 0zM3.2 5.9a6.5 6.5 0 018.6 0l-1.2 1.4a4.7 4.7 0 00-6.2 0zM.6 3.3a10.3 10.3 0 0113.8 0l-1.2 1.4a8.4 8.4 0 00-11.4 0z"/></svg>
 <svg class="abs" style="right:18px;top:15.5px" width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.4" fill="none" stroke="#000" opacity=".35"/><rect x="2" y="2" width="19" height="8" rx="2"/><rect x="23.6" y="4" width="1.6" height="4" rx=".8" opacity=".4"/></svg></div>`);
let render=()=>{}, DURATION=qn('dur',3);

if(SCENE==='imessage'){ const say=qn('say',.4);
  statusBar();
  el(`<div class="abs" style="left:0;right:0;top:44px;height:92px;background:rgba(249,249,249,.94);border-bottom:.5px solid #D1D1D6">
   <svg class="abs" style="left:10px;top:14px" width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <div class="abs" style="left:26px;top:15px;background:#0A84FF;color:#fff;font-size:12px;font-weight:600;border-radius:10px;padding:1px 6px">12</div>
   <div class="abs" style="left:50%;top:6px;margin-left:-27px;width:54px;height:54px;border-radius:50%;background:linear-gradient(#A5A9B3,#868A93);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600">MK</div>
   <div class="abs" style="left:0;right:0;top:64px;text-align:center;font-size:12px;color:#000">Mike – Essex St <span style="color:#8E8E93">›</span></div>
   <svg class="abs" style="right:14px;top:16px" width="26" height="18" viewBox="0 0 26 18"><rect x="1" y="2" width="16" height="14" rx="3" fill="none" stroke="#0A84FF" stroke-width="2"/><path d="M17 7l7-4v12l-7-4z" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linejoin="round"/></svg></div>`);
  el(`<div class="abs" style="left:0;right:0;top:148px;text-align:center;font-size:11.5px;color:#8E8E93"><b style="font-weight:600">iMessage</b><br>Today 9:41 AM</div>`);
  const b1=el(`<div class="bub in" style="top:186px">Sounds good but I need to talk to my wife first</div>`);
  const b2=el(`<div class="bub out" style="top:250px">If it were just up to you, would you do it?</div>`);
  const del=el(`<div class="abs" style="right:16px;top:318px;font-size:11px;color:#8E8E93;font-weight:500">Delivered</div>`);
  el(`<div class="abs" style="left:0;right:0;bottom:0;height:86px;background:#fff">
   <div class="abs" style="left:10px;top:8px;width:30px;height:30px;border-radius:50%;background:#E9E9EB;display:flex;align-items:center;justify-content:center;font-size:20px;color:#8E8E93">+</div>
   <div class="abs" id="fld" style="left:48px;right:10px;top:7px;min-height:33px;border:1px solid #D1D1D6;border-radius:17px;padding:7px 40px 7px 12px;font-size:15.5px;line-height:1.25;color:#C7C7CC">iMessage</div>
   <div class="abs" id="snd" style="right:14px;top:11px;width:26px;height:26px;border-radius:50%;background:#0A84FF;display:none;align-items:center;justify-content:center"><svg width="12" height="14" viewBox="0 0 12 14"><path d="M6 13V2M1.5 6L6 1.5 10.5 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`);
  const fld=document.getElementById('fld'), snd=document.getElementById('snd'); const LINE='If it were just up to you, would you do it?';
  el('<div class="home"></div>');
  render=t=>{
    const a=prog(t,0,.25); b1.style.opacity=clamp(a*3);
    const sendAt=qn('send',say+1.2); const n=Math.floor(LINE.length*clamp((t-say)/(sendAt-say-.08)));
    if(t<sendAt && n>0){fld.textContent=LINE.slice(0,n); fld.style.color='#000'; snd.style.display='flex';} else {fld.textContent='iMessage'; fld.style.color='#C7C7CC'; snd.style.display='none';}
    const b=prog(t,sendAt,sendAt+.3); b2.style.opacity=b>0?1:0; b2.style.transform=`translateY(${(1-easeOut(b))*40}px) scale(${lerp(.92,1,easeOut(b))})`; b2.style.transformOrigin='100% 100%';
    del.style.opacity=clamp(prog(t,sendAt+.4,sendAt+.6));
  };
}

if(SCENE==='notes'){ const strike=qn('strike',.5), type=qn('type',1.0); const TITLE=Q.get('title')||'Objections', L1=Q.get('l1')||'"I need to talk to my spouse"', L2=Q.get('l2')||'= no reason to say yes yet';
  statusBar();
  el(`<div class="abs" style="left:0;right:0;top:44px;height:44px">
   <div class="abs" style="left:8px;top:10px;display:flex;align-items:center;gap:4px;color:#E5A000;font-size:17px"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="#E5A000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Notes</div>
   <svg class="abs" style="right:56px;top:12px" width="20" height="22" viewBox="0 0 20 22"><path d="M10 1v13M5 6l5-5 5 5M3 10v10h14V10" fill="none" stroke="#E5A000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <div class="abs" style="right:14px;top:10px;width:26px;height:26px;border-radius:50%;border:2px solid #E5A000;display:flex;align-items:center;justify-content:center;gap:2px"><span style="width:3px;height:3px;border-radius:50%;background:#E5A000"></span><span style="width:3px;height:3px;border-radius:50%;background:#E5A000"></span><span style="width:3px;height:3px;border-radius:50%;background:#E5A000"></span></div></div>`);
  el(`<div class="abs" style="left:0;right:0;top:96px;text-align:center;font-size:12px;color:#8E8E93">November 21, 2026 at 9:41 AM</div>`);
  el(`<div class="abs" style="left:20px;right:20px;top:122px;font-size:26px;font-weight:700;letter-spacing:-.6px">${TITLE}</div>`);
  const l1=el(`<div class="abs" style="left:20px;right:20px;top:166px;font-size:17px;line-height:1.35"><span id="o" style="position:relative">${L1}<span id="ln" style="position:absolute;left:0;top:55%;height:1.6px;background:#000;width:0"></span></span></div>`);
  // typed lines: l2..l5 at t2..t5 (l2 falls back to 'type'); l1 is typed at t1 when given, else shown from the start
  const T1=Q.has('t1')?qn('t1',0):null, SPD=qn('spd',.85);
  const L=[[L2,qn('t2',type)]]; for(const k of [3,4,5]) if(Q.get('l'+k)) L.push([Q.get('l'+k),qn('t'+k,9)]);
  const rows=L.map(([txt,t0],i)=>{const d=el(`<div class="abs" style="left:20px;right:20px;top:${198+i*30}px;font-size:17px;line-height:1.35"><span class="tx"></span><span class="cur" style="display:inline-block;width:2px;height:21px;background:#E5A000;vertical-align:-4px;margin-left:1px;opacity:0"></span></div>`);return [d.querySelector('.tx'),d.querySelector('.cur'),txt,t0];});
  el('<div class="home"></div>');
  const ln=l1.querySelector('#ln'), o=l1.querySelector('#o'), o1=o.firstChild;
  render=t=>{
    if(T1!==null){ const n=Math.floor(L1.length*clamp((t-T1)/Math.min(.7,SPD))); o1.textContent=L1.slice(0,n); }
    ln.style.width=(100*easeOut(prog(t,strike,strike+.3)))+'%';
    const cur=rows.filter(r=>t>=r[3]-.2).pop();
    rows.forEach(r=>{ const [tx,c,txt,t0]=r; const n=Math.floor(txt.length*clamp((t-t0)/SPD)); tx.textContent=txt.slice(0,n);
      c.style.opacity=(r===cur && (n<txt.length || Math.floor(t*2.2)%2===0))?1:0; });
  };
}

if(SCENE==='reminders'){ const tGet=qn('get',.9), tClose=qn('close',2.2), tNo=qn('no',3.6), tFig=qn('fig',4.8);
  statusBar();
  el(`<div class="abs" style="left:8px;top:54px;display:flex;align-items:center;gap:4px;color:#0A84FF;font-size:17px"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Lists</div>`);
  el(`<div class="abs" style="left:18px;top:94px;font-size:30px;font-weight:700;color:#FF9500;letter-spacing:-.6px">Then do this</div>`);
  const items=[['Yes → get the spouse outside','#FF9500',tGet,0],['Close it on the spot','#FF9500',tClose,0],['No → find the real objection','#FF9500',tFig,tNo]];
  const R=items.map((it,i)=>el(`<div class="ritem" style="top:${148+i*56}px"><div class="c"></div><div class="t">${it[0]}</div></div>`));
  el('<div class="home"></div>');
  render=t=>{
    R.forEach((r,i)=>{const [txt,col,tc,ta]=items[i]; const a=prog(t,ta,ta+.3); r.style.opacity=ta>0?clamp(a*3):1; r.style.transform=`translateY(${ta>0?(1-easeOut(a))*-12:0}px)`;
      const c=r.querySelector('.c'), k=prog(t,tc,tc+.25);
      if(k>0){c.style.borderColor=col; c.innerHTML=`<div style="width:15px;height:15px;border-radius:50%;background:${col};transform:scale(${spring(k)})"></div>`;
        r.querySelector('.t').style.color=k>=1?'#8E8E93':'#000';} else {c.style.borderColor='#C7C7CC'; c.innerHTML=''; r.querySelector('.t').style.color='#000';}});
  };
}
window.DURATION=DURATION; window.renderAt=t=>render(t); render(0);
</script></body></html>
